name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run ty
        run: uv run ty check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run pytest
        run: uv run pytest -v -n 2 --dist loadfile --junitxml=backend-junit.xml

      - name: Upload backend JUnit report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-junit
          path: backend-junit.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Check frontend
        run: pnpm check
        working-directory: frontend

      - name: Test frontend
        run: pnpm test
        working-directory: frontend

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend

      - name: Smoke test frontend
        run: pnpm test:smoke
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      - name: Upload frontend Playwright output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/**
          if-no-files-found: ignore

  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select BuildKit cache scope
        id: cache-scope
        shell: bash
        env:
          RAW_BRANCH_NAME: ${{ github.head_ref || github.ref_name || 'main' }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || 'main' }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "pull_request" && "$REF_TYPE" == "branch" && "$RAW_BRANCH_NAME" == "$DEFAULT_BRANCH" ]]; then
            cache_scope_suffix=main
          else
            safe_prefix="${RAW_BRANCH_NAME//[^a-zA-Z0-9_.-]/-}"
            safe_prefix="${safe_prefix:0:32}"
            scope_hash="$(printf '%s' "$HEAD_REPOSITORY:$RAW_BRANCH_NAME" | sha256sum)"
            scope_hash="${scope_hash%% *}"
            cache_scope_suffix="${safe_prefix:-head}-${scope_hash:0:12}"
          fi

          printf 'CACHE_SCOPE_SUFFIX=%s\n' "$cache_scope_suffix" >> "$GITHUB_ENV"
          printf 'suffix=%s\n' "$cache_scope_suffix" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate production compose example
        run: docker compose --env-file .env.prod.example -f docker-compose.prod.example.yml config

      - name: Validate production compose app environment
        run: python3 scripts/validate_prod_compose_env.py

      - name: Build main image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: main
          tags: memexpert-main:ci
          load: true
          cache-from: |
            type=gha,scope=memexpert-main-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-main-main
          cache-to: type=gha,scope=memexpert-main-${{ steps.cache-scope.outputs.suffix }},mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          tags: memexpert-worker:ci
          load: true
          cache-from: |
            type=gha,scope=memexpert-worker-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-worker-main
          cache-to: type=gha,scope=memexpert-worker-${{ steps.cache-scope.outputs.suffix }},mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          tags: memexpert-frontend:ci
          load: true
          cache-from: |
            type=gha,scope=memexpert-frontend-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-frontend-main
          cache-to: type=gha,scope=memexpert-frontend-${{ steps.cache-scope.outputs.suffix }},mode=max

      - name: Build E2E runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/Dockerfile
          tags: memexpert-e2e-runner:ci
          load: true
          cache-from: |
            type=gha,scope=memexpert-e2e-runner-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-e2e-runner-main
          cache-to: type=gha,scope=memexpert-e2e-runner-${{ steps.cache-scope.outputs.suffix }},mode=max

      - name: Smoke test app images
        run: |
          set -euo pipefail

          docker network create memexpert-smoke
          docker run -d \
            --name memexpert-main-smoke \
            --network memexpert-smoke \
            -e APP_HOST=0.0.0.0 \
            -e APP_PORT=8000 \
            -p 8000:8000 \
            memexpert-main:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/health

          docker run --rm memexpert-main:ci sh -c 'command -v memexpert-api && command -v memexpert-bot && command -v memexpert-scheduler && python -c "import importlib.util, sys; absent=(\"paddleocr\", \"paddle\", \"PIL\", \"imagehash\"); sys.exit(0 if all(importlib.util.find_spec(name) is None for name in absent) else 1)"'
          docker run --rm memexpert-worker:ci sh -c 'command -v memexpert-workers && command -v ffmpeg && command -v ffprobe && python -c "import importlib.util, sys; absent=(\"paddleocr\", \"paddle\"); present=(\"PIL\", \"imagehash\"); sys.exit(0 if all(importlib.util.find_spec(name) is None for name in absent) and all(importlib.util.find_spec(name) is not None for name in present) else 1)" && /opt/paddleocr-venv/bin/python -c "import paddle, paddleocr; print(\"paddleocr-helper-ok\")" && /opt/paddleocr-venv/bin/python /app/scripts/paddleocr_json.py --help >/dev/null'
          docker run --rm memexpert-worker:ci sh -c 'ffmpeg -version 2>&1 | grep -F "ffmpeg version 8.1.2 "'
          docker run --rm memexpert-worker:ci sh -c 'ffprobe -version 2>&1 | grep -F "ffprobe version 8.1.2 "'

          docker run -d \
            --name memexpert-frontend-smoke \
            --network memexpert-smoke \
            -e HOST=0.0.0.0 \
            -e PORT=3000 \
            -e API_BASE_URL=http://memexpert-main-smoke:8000 \
            -p 3000:3000 \
            memexpert-frontend:ci

          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ >/dev/null

      - name: Show smoke logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs memexpert-main-smoke || true
          docker logs memexpert-frontend-smoke || true

      - name: Tear down smoke containers
        if: always()
        run: |
          docker rm -f memexpert-frontend-smoke memexpert-main-smoke || true
          docker network rm memexpert-smoke || true

      - name: Run PRD E2E with prebuilt images
        env:
          E2E_SKIP_IMAGE_BUILD: "1"
          MEMEXPERT_MAIN_IMAGE: memexpert-main:ci
          MEMEXPERT_WORKER_IMAGE: memexpert-worker:ci
          MEMEXPERT_FRONTEND_IMAGE: memexpert-frontend:ci
          MEMEXPERT_E2E_RUNNER_IMAGE: memexpert-e2e-runner:ci
        run: python scripts/run_container_e2e.py

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: .artifacts/e2e/**
          if-no-files-found: ignore

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract main image metadata
        if: github.event_name != 'pull_request'
        id: meta-main
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/averyanalex/memexpert/main
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Extract worker image metadata
        if: github.event_name != 'pull_request'
        id: meta-worker
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/averyanalex/memexpert/worker
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Extract frontend image metadata
        if: github.event_name != 'pull_request'
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/averyanalex/memexpert/frontend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push main image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: main
          push: true
          tags: ${{ steps.meta-main.outputs.tags }}
          labels: ${{ steps.meta-main.outputs.labels }}
          cache-from: |
            type=gha,scope=memexpert-main-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-main-main
          cache-to: type=gha,scope=memexpert-main-${{ steps.cache-scope.outputs.suffix }},mode=max

      - name: Build and push worker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: worker
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: |
            type=gha,scope=memexpert-worker-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-worker-main
          cache-to: type=gha,scope=memexpert-worker-${{ steps.cache-scope.outputs.suffix }},mode=max

      - name: Build and push frontend image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: |
            type=gha,scope=memexpert-frontend-${{ steps.cache-scope.outputs.suffix }}
            type=gha,scope=memexpert-frontend-main
          cache-to: type=gha,scope=memexpert-frontend-${{ steps.cache-scope.outputs.suffix }},mode=max

  deploy:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - frontend
      - e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy production
        uses: AveryanAlex/reploy-action@v1
        with:
          url: ${{ vars.REPLOY_URL }}
          token: ${{ secrets.REPLOY_TOKEN }}
          images: |
            ghcr.io/averyanalex/memexpert/main:main
            ghcr.io/averyanalex/memexpert/worker:main
            ghcr.io/averyanalex/memexpert/frontend:main
