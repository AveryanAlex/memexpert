[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memexpert"
version = "0.1.0"
description = "Core Python services for MemeXpert"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.6.2",
    "aiogram>=3.27.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.42.83",
    "fastapi>=0.135.3",
    "httpx>=0.28.1",
    "meilisearch-python-sdk>=7.1.2",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.17.1",
    "redis[hiredis]>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.43.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.9",
    "testcontainers[postgres,redis]>=4.14.2",
]

[project.scripts]
memexpert-api = "memexpert.api.main:main"
memexpert-bot = "memexpert.bot.main:main"
memexpert-workers = "memexpert.workers.main:main"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
