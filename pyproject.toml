[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "memexpert"
version = "0.1.0"
description = "Core Python services for MemeXpert"
requires-python = ">=3.14"
dependencies = [
    "aio-pika>=9.6.2",
    "aiogram>=3.27.0",
    "alembic>=1.18.4",
    "apscheduler>=3.11.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "boto3>=1.42.83",
    "cryptography>=49.0.0",
    "fastapi>=0.135.3",
    "faststream[rabbit]>=0.6.7",
    "httpx>=0.28.1",
    "meilisearch-python-sdk>=7.1.2",
    "pydantic-ai-slim[openai]>=1.107.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.12.1",
    "python-multipart>=0.0.24",
    "qdrant-client>=1.17.1",
    "redis[hiredis]>=7.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "telethon>=1.43.0",
    "uvicorn[standard]>=0.43.0",
]

[dependency-groups]
worker = [
    "imagehash>=4.3.2",
    "pillow>=12.2.0",
]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.9",
    "testcontainers[postgres,redis]>=4.14.2",
    "ty>=0.0.49",
]

[tool.uv]
default-groups = ["dev", "worker"]

[project.scripts]
memexpert-api = "memexpert.api.main:main"
memexpert-admin-users = "scripts.admin_users:main"
memexpert-analytics = "scripts.analytics:main"
memexpert-backfill-video-posters = "scripts.backfill_video_posters:main"
memexpert-bot = "memexpert.bot.main:main"
memexpert-reconcile-sha-duplicates = "scripts.reconcile_sha_duplicates:main"
memexpert-scheduler = "memexpert.scheduler.main:main"
memexpert-telegram-crawler = "memexpert.crawlers.telegram.main:main"
memexpert-workers = "memexpert.workers.main:main"

[tool.ruff]
line-length = 120
target-version = "py314"
force-exclude = true
extend-exclude = [".env.example"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = ["-n", "auto", "--maxprocesses", "4", "--dist", "loadfile"]
testpaths = ["tests"]
markers = [
    "transactional_db: run migrated_db_session inside an outer transaction that rolls back after the test",
]
