x-main-image: &main-image
  image: ${MEMEXPERT_MAIN_IMAGE:-ghcr.io/averyanalex/memexpert/main:main}

x-worker-image: &worker-image
  image: ${MEMEXPERT_WORKER_IMAGE:-ghcr.io/averyanalex/memexpert/worker:main}

x-app-env: &app-env
  APP_HOST: 0.0.0.0
  APP_PORT: 8000
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
  QDRANT_URL: http://qdrant:6333
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_REGION: ${S3_REGION:-us-east-1}
  IMGPROXY_BASE_URL: http://imgproxy:8080
  IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY}
  IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT}
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  PIPELINE_OPERATOR_TOKEN: ${PIPELINE_OPERATOR_TOKEN:?set PIPELINE_OPERATOR_TOKEN}
  PIPELINE_ALLOWED_MIME_TYPES: ${PIPELINE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp,image/gif,video/mp4,video/quicktime,video/webm}
  PIPELINE_BROKER_CONNECTION_TIMEOUT_SECONDS: ${PIPELINE_BROKER_CONNECTION_TIMEOUT_SECONDS:-10.0}
  PIPELINE_BROKER_SOURCE_ENGAGEMENT_CAPTURE_QUEUE: ${PIPELINE_BROKER_SOURCE_ENGAGEMENT_CAPTURE_QUEUE:-pipeline.source_engagement_capture}
  PIPELINE_STORAGE_CONNECTION_TIMEOUT_SECONDS: ${PIPELINE_STORAGE_CONNECTION_TIMEOUT_SECONDS:-10.0}
  PIPELINE_VOYAGE_PROVIDER_MODE: ${PIPELINE_VOYAGE_PROVIDER_MODE:-live}
  PIPELINE_VOYAGE_MODEL: ${PIPELINE_VOYAGE_MODEL:-voyage-multimodal-3.5}
  PIPELINE_VOYAGE_OUTPUT_DIMENSIONS: ${PIPELINE_VOYAGE_OUTPUT_DIMENSIONS:-1024}
  PIPELINE_VOYAGE_API_URL: ${PIPELINE_VOYAGE_API_URL:-https://api.voyageai.com/v1/multimodalembeddings}
  PIPELINE_VOYAGE_API_KEY: ${PIPELINE_VOYAGE_API_KEY:-}
  PIPELINE_VOYAGE_TIMEOUT_SECONDS: ${PIPELINE_VOYAGE_TIMEOUT_SECONDS:-30.0}
  PIPELINE_CLASSIFICATION_PROVIDER_MODE: ${PIPELINE_CLASSIFICATION_PROVIDER_MODE:-live}
  PIPELINE_CLASSIFICATION_API_URL: ${PIPELINE_CLASSIFICATION_API_URL:-}
  PIPELINE_CLASSIFICATION_API_KEY: ${PIPELINE_CLASSIFICATION_API_KEY:-}
  PIPELINE_CLASSIFICATION_MODEL: ${PIPELINE_CLASSIFICATION_MODEL:-memexpert-nsfw-v1}
  PIPELINE_CLASSIFICATION_TIMEOUT_SECONDS: ${PIPELINE_CLASSIFICATION_TIMEOUT_SECONDS:-15.0}
  PIPELINE_CLASSIFICATION_NSFW_THRESHOLD: ${PIPELINE_CLASSIFICATION_NSFW_THRESHOLD:-0.5}
  PIPELINE_SEO_PROVIDER_MODE: ${PIPELINE_SEO_PROVIDER_MODE:-static}
  PIPELINE_SEO_MODEL: ${PIPELINE_SEO_MODEL:-gpt-5-mini}
  PIPELINE_SEO_API_BASE_URL: ${PIPELINE_SEO_API_BASE_URL:-}
  PIPELINE_SEO_API_KEY: ${PIPELINE_SEO_API_KEY:-}
  PIPELINE_SEO_TIMEOUT_SECONDS: ${PIPELINE_SEO_TIMEOUT_SECONDS:-30.0}
  PIPELINE_SEO_MAX_ATTEMPTS: ${PIPELINE_SEO_MAX_ATTEMPTS:-2}
  PIPELINE_SEO_IMAGE_MAX_BYTES: ${PIPELINE_SEO_IMAGE_MAX_BYTES:-5242880}
  PIPELINE_SEO_PROMPT_VERSION: ${PIPELINE_SEO_PROMPT_VERSION:-meme-seo-v1}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?set AUTH_JWT_SECRET}
  AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-2592000}
  AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-memexpert_access_token}
  AUTH_ACCESS_COOKIE_SECURE: ${AUTH_ACCESS_COOKIE_SECURE:-true}
  AUTH_ACCESS_COOKIE_HTTPONLY: ${AUTH_ACCESS_COOKIE_HTTPONLY:-true}
  AUTH_ACCESS_COOKIE_SAMESITE: ${AUTH_ACCESS_COOKIE_SAMESITE:-lax}
  AUTH_ACCESS_COOKIE_PATH: ${AUTH_ACCESS_COOKIE_PATH:-/}
  AUTH_ACCESS_COOKIE_DOMAIN: ${AUTH_ACCESS_COOKIE_DOMAIN:-}
  AUTH_TELEGRAM_BOT_TOKEN: ${AUTH_TELEGRAM_BOT_TOKEN:-}
  AUTH_TELEGRAM_BOT_USERNAME: ${AUTH_TELEGRAM_BOT_USERNAME:-}
  AUTH_TELEGRAM_LOGIN_MAX_AGE_SECONDS: ${AUTH_TELEGRAM_LOGIN_MAX_AGE_SECONDS:-300}
  AUTH_TELEGRAM_MINIAPP_MAX_AGE_SECONDS: ${AUTH_TELEGRAM_MINIAPP_MAX_AGE_SECONDS:-300}
  AUTH_TELEGRAM_LINK_CODE_TTL_SECONDS: ${AUTH_TELEGRAM_LINK_CODE_TTL_SECONDS:-600}
  AUTH_TELEGRAM_LINK_RETURN_URL: ${AUTH_TELEGRAM_LINK_RETURN_URL:-}
  AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
  AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
  AUTH_GOOGLE_REDIRECT_URI: ${AUTH_GOOGLE_REDIRECT_URI:-}
  AUTH_GOOGLE_TOKEN_URL: ${AUTH_GOOGLE_TOKEN_URL:-https://oauth2.googleapis.com/token}
  AUTH_GOOGLE_USERINFO_URL: ${AUTH_GOOGLE_USERINFO_URL:-https://openidconnect.googleapis.com/v1/userinfo}
  AUTH_GOOGLE_TIMEOUT_SECONDS: ${AUTH_GOOGLE_TIMEOUT_SECONDS:-10.0}
  SECURITY_CORS_ALLOWED_ORIGINS: ${SECURITY_CORS_ALLOWED_ORIGINS:?set SECURITY_CORS_ALLOWED_ORIGINS}
  SECURITY_CORS_ALLOWED_ORIGIN_REGEX: ${SECURITY_CORS_ALLOWED_ORIGIN_REGEX:-^https://([a-z0-9-]+\.)?memexpert\.net$}
  TELEGRAM_SESSION_ENCRYPTION_SECRET: ${TELEGRAM_SESSION_ENCRYPTION_SECRET:?set TELEGRAM_SESSION_ENCRYPTION_SECRET}
  SCHEDULER_MATERIALIZED_VIEW_REFRESH_ENABLED: ${SCHEDULER_MATERIALIZED_VIEW_REFRESH_ENABLED:-true}
  SCHEDULER_MATERIALIZED_VIEW_REFRESH_INTERVAL_SECONDS: ${SCHEDULER_MATERIALIZED_VIEW_REFRESH_INTERVAL_SECONDS:-300}
  SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_ENABLED: ${SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_ENABLED:-true}
  SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_INTERVAL_SECONDS: ${SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_INTERVAL_SECONDS:-21600}
  SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_BATCH_SIZE: ${SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_BATCH_SIZE:-100}
  SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_LEASE_TIMEOUT_SECONDS: ${SCHEDULER_SOURCE_ENGAGEMENT_CAPTURE_LEASE_TIMEOUT_SECONDS:-1800}
  SCHEDULER_MOTD_ENABLED: ${SCHEDULER_MOTD_ENABLED:-true}
  SCHEDULER_MOTD_INTERVAL_SECONDS: ${SCHEDULER_MOTD_INTERVAL_SECONDS:-86400}
  MOTD_ALGORITHM_VERSION: ${MOTD_ALGORITHM_VERSION:-motd_v1}
  MOTD_CANDIDATE_LOOKBACK_DAYS: ${MOTD_CANDIDATE_LOOKBACK_DAYS:-30}
  MOTD_CANDIDATE_LIMIT: ${MOTD_CANDIDATE_LIMIT:-50}
  MOTD_MIN_QUALITY_SCORE: ${MOTD_MIN_QUALITY_SCORE:-0.5}
  MOTD_POPULARITY_WEIGHT: ${MOTD_POPULARITY_WEIGHT:-0.35}
  MOTD_TRENDING_GROWTH_WEIGHT: ${MOTD_TRENDING_GROWTH_WEIGHT:-0.30}
  MOTD_NOVELTY_WEIGHT: ${MOTD_NOVELTY_WEIGHT:-0.20}
  MOTD_QUALITY_WEIGHT: ${MOTD_QUALITY_WEIGHT:-0.15}
  SCHEDULER_SEARCH_INDEX_SYNC_ENABLED: ${SCHEDULER_SEARCH_INDEX_SYNC_ENABLED:-true}
  SCHEDULER_SEARCH_INDEX_SYNC_INTERVAL_SECONDS: ${SCHEDULER_SEARCH_INDEX_SYNC_INTERVAL_SECONDS:-600}
  SCHEDULER_SEO_BACKLOG_BATCHES_ENABLED: ${SCHEDULER_SEO_BACKLOG_BATCHES_ENABLED:-true}
  SCHEDULER_SEO_BACKLOG_BATCHES_INTERVAL_SECONDS: ${SCHEDULER_SEO_BACKLOG_BATCHES_INTERVAL_SECONDS:-900}
  SCHEDULER_ADVISORY_LOCK_ENABLED: ${SCHEDULER_ADVISORY_LOCK_ENABLED:-true}
  SCHEDULER_ADVISORY_LOCK_KEY: ${SCHEDULER_ADVISORY_LOCK_KEY:-0,0}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  meilisearch:
    image: getmeili/meilisearch:latest
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    command:
      [
        "/bin/sh",
        "-c",
        "mc alias set memexpert http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing \"memexpert/$${S3_BUCKET}\"",
      ]

  imgproxy:
    image: darthsim/imgproxy:latest
    restart: unless-stopped
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      IMGPROXY_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      IMGPROXY_BIND: ":8080"
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT}
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *main-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      imgproxy:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *main-image
    restart: unless-stopped
    environment: *app-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  workers:
    <<: *worker-image
    restart: unless-stopped
    environment:
      <<: *app-env
      PIPELINE_OCR_PROVIDER_MODE: ${PIPELINE_OCR_PROVIDER_MODE:-live}
      PIPELINE_OCR_PRIMARY_ENGINE: ${PIPELINE_OCR_PRIMARY_ENGINE:-paddleocr}
      PIPELINE_OCR_PADDLE_COMMAND: ${PIPELINE_OCR_PADDLE_COMMAND:?set PIPELINE_OCR_PADDLE_COMMAND}
      PIPELINE_OCR_FALLBACK_ENGINE: ${PIPELINE_OCR_FALLBACK_ENGINE:-}
      PIPELINE_OCR_FALLBACK_COMMAND: ${PIPELINE_OCR_FALLBACK_COMMAND:-}
      PIPELINE_OCR_TIMEOUT_SECONDS: ${PIPELINE_OCR_TIMEOUT_SECONDS:-30.0}
      PIPELINE_OCR_LOW_CONFIDENCE_THRESHOLD: ${PIPELINE_OCR_LOW_CONFIDENCE_THRESHOLD:-0.6}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      disable: true

  telegram-crawler:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-telegram-crawler"]
    environment:
      <<: *app-env
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  scheduler:
    <<: *main-image
    restart: unless-stopped
    command: ["memexpert-scheduler"]
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  bot:
    <<: *main-image
    profiles: ["bot"]
    restart: unless-stopped
    command: ["sh", "-c", ": \"$${AUTH_TELEGRAM_BOT_TOKEN:?set AUTH_TELEGRAM_BOT_TOKEN when enabling the bot profile}\" && exec memexpert-bot"]
    environment:
      <<: *app-env
      AUTH_TELEGRAM_BOT_TOKEN: ${AUTH_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  frontend:
    image: ${MEMEXPERT_FRONTEND_IMAGE:-ghcr.io/averyanalex/memexpert/frontend:main}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
      API_BASE_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  meili_data:
  minio_data:
