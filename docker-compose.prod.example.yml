x-worker-env: &worker-env
  <<: *app-env
  RUNTIME_HEALTH_FILE: /tmp/memexpert-runtime-health.json
  RUNTIME_HEALTH_INTERVAL_SECONDS: "10.0"
  RUNTIME_HEALTH_STALE_AFTER_SECONDS: "45.0"
  RUNTIME_HEALTH_OPERATION_TIMEOUT_SECONDS: "900.0"
  DATABASE_POOL_TIMEOUT_SECONDS: "5.0"
  PIPELINE_OCR_PROVIDER_MODE: ${PIPELINE_OCR_PROVIDER_MODE:-live}
  PIPELINE_OCR_PRIMARY_ENGINE: ${PIPELINE_OCR_PRIMARY_ENGINE:-paddleocr}
  PIPELINE_OCR_PADDLE_COMMAND: ${PIPELINE_OCR_PADDLE_COMMAND:?set PIPELINE_OCR_PADDLE_COMMAND}
  PIPELINE_OCR_FALLBACK_ENGINE: ${PIPELINE_OCR_FALLBACK_ENGINE:-}
  PIPELINE_OCR_FALLBACK_COMMAND: ${PIPELINE_OCR_FALLBACK_COMMAND:-}
  PIPELINE_OCR_TIMEOUT_SECONDS: ${PIPELINE_OCR_TIMEOUT_SECONDS:-120.0}
  PIPELINE_OCR_LOW_CONFIDENCE_THRESHOLD: ${PIPELINE_OCR_LOW_CONFIDENCE_THRESHOLD:-0.6}

services:
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7.4.9
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.1-management
    user: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set RABBITMQ_DEFAULT_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.18.2
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  meilisearch:
    image: getmeili/meilisearch:v1.46.1
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:?set MEILISEARCH_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: [""]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    command:
      [
        "/bin/sh",
        "-c",
        "mc alias set memexpert http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" && mc mb --ignore-existing \"memexpert/$${S3_BUCKET}\"",
      ]

  imgproxy:
    image: darthsim/imgproxy:v4.0.4
    restart: unless-stopped
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: http://minio:9000
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      IMGPROXY_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
      IMGPROXY_BIND: ":8080"
      IMGPROXY_KEY: ${IMGPROXY_KEY:?set IMGPROXY_KEY}
      IMGPROXY_SALT: ${IMGPROXY_SALT:?set IMGPROXY_SALT}
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${IMGPROXY_BIND_ADDRESS:-127.0.0.1}:${IMGPROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *main-image
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      imgproxy:
        condition: service_healthy
    healthcheck:
      disable: true

  api:
    <<: *main-image
    restart: unless-stopped
    environment:
      <<: *app-env
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-media:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-workers", "--role", "media"]
    environment:
      <<: *worker-env
      PIPELINE_WORKER_PREFETCH_COUNT: "1"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_APPLICATION_NAME: memexpert-worker-media
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 256

  worker-ocr:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-workers", "--role", "ocr"]
    environment:
      <<: *worker-env
      PIPELINE_WORKER_PREFETCH_COUNT: "2"
      PIPELINE_OCR_PADDLE_COMMAND: /opt/paddleocr-venv/bin/python /app/scripts/paddleocr_json.py --input {input} --cpu-threads 8
      OMP_NUM_THREADS: "8"
      OPENBLAS_NUM_THREADS: "8"
      MKL_NUM_THREADS: "8"
      NUMEXPR_NUM_THREADS: "8"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_APPLICATION_NAME: memexpert-worker-ocr
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s
    mem_limit: 8g
    cpus: 16.0
    pids_limit: 384

  worker-enrichment:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-workers", "--role", "enrichment"]
    environment:
      <<: *worker-env
      PIPELINE_WORKER_PREFETCH_COUNT: "2"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_APPLICATION_NAME: memexpert-worker-enrichment
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 4g
    cpus: 4.0
    pids_limit: 192

  worker-sync:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-workers", "--role", "sync"]
    environment:
      <<: *worker-env
      PIPELINE_WORKER_PREFETCH_COUNT: "4"
      DATABASE_POOL_SIZE: "3"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_APPLICATION_NAME: memexpert-worker-sync
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128

  worker-telegram:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-workers", "--role", "telegram"]
    environment:
      <<: *worker-env
      PIPELINE_WORKER_PREFETCH_COUNT: "1"
      DATABASE_POOL_SIZE: "2"
      DATABASE_MAX_OVERFLOW: "1"
      DATABASE_APPLICATION_NAME: memexpert-worker-telegram
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128

  telegram-crawler:
    <<: *worker-image
    restart: unless-stopped
    command: ["memexpert-telegram-crawler"]
    environment:
      <<: *app-env
      DATABASE_APPLICATION_NAME: memexpert-telegram-crawler
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 300s

  scheduler:
    <<: *main-image
    restart: unless-stopped
    command: ["memexpert-scheduler"]
    environment:
      <<: *app-env
      DATABASE_APPLICATION_NAME: memexpert-scheduler
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "memexpert-runtime-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  bot:
    <<: *main-image
    profiles: ["bot"]
    restart: unless-stopped
    command: ["sh", "-c", ": \"$${AUTH_TELEGRAM_BOT_TOKEN:?set AUTH_TELEGRAM_BOT_TOKEN when enabling the bot profile}\" && exec memexpert-bot"]
    environment:
      <<: *app-env
      AUTH_TELEGRAM_BOT_TOKEN: ${AUTH_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true

  frontend:
    image: ${MEMEXPERT_FRONTEND_IMAGE:-ghcr.io/averyanalex/memexpert/frontend:main}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      ORIGIN: ${FRONTEND_ORIGIN:?set FRONTEND_ORIGIN}
      API_BASE_URL: http://api:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  meili_data:
  minio_data:
