# Local development infrastructure only. The production app stack example lives
# in docker-compose.prod.example.yml.
services:
  postgres:
    image: postgres:16.14
    container_name: memexpert-postgres
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memexpert}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memexpert}
      POSTGRES_DB: ${POSTGRES_DB:-memexpert}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-memexpert} -d ${POSTGRES_DB:-memexpert}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4.9
    container_name: memexpert-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  rabbitmq:
    image: rabbitmq:4.3.1-management
    user: rabbitmq
    container_name: memexpert-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-memexpert}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-memexpert}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: memexpert-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  meilisearch:
    image: getmeili/meilisearch:v1.46.1
    container_name: memexpert-meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-memexpert-dev-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:7700/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: memexpert-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-memexpert}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-memexpert-secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  imgproxy:
    image: darthsim/imgproxy:v4.0.4
    container_name: memexpert-imgproxy
    environment:
      IMGPROXY_USE_S3: "true"
      IMGPROXY_S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      IMGPROXY_S3_REGION: ${S3_REGION:-us-east-1}
      IMGPROXY_S3_USE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-memexpert}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-memexpert-secret}
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /tmp
      IMGPROXY_BIND: ":8080"
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "${IMGPROXY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.16
    container_name: memexpert-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-memexpert}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:80"

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  meili_data:
  minio_data:
